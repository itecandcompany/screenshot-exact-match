name: Nextdoor Plus checks

on:
  push:
    branches:
      - feature/nextdoor-plus
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed Nextdoor Plus modules
        run: >-
          bunx eslint
          src/lib/opportunity-filters.ts
          src/lib/opportunity-display.ts
          src/lib/opportunity-detail.ts
          src/lib/opportunity-submissions.ts
          src/lib/opportunity-submission-filters.ts
          src/lib/safe-external-url.ts
          src/lib/supabase/client.ts
          src/lib/supabase/session-refresh.ts
          src/lib/supabase/atomic-save-compat.ts
          src/lib/workspace-profile.ts
          src/lib/workspace-profile-settings.ts
          src/lib/workspace-overview.ts
          src/components/plus-workspace-profile.tsx
          src/components/plus-opportunity-intake.tsx
          src/routes/plus.tsx
          'src/routes/plus_.opportunities.$opportunityId.tsx'
          src/test/opportunity-filters.test.ts
          src/test/opportunity-display.test.ts
          src/test/opportunity-detail.test.ts
          src/test/opportunity-submissions.test.ts
          src/test/opportunity-submission-filters.test.ts
          src/test/opportunity-save-migration.test.ts
          src/test/nextdoor-plus-privileges-migration.test.ts
          src/test/atomic-save-compat.test.ts
          src/test/safe-external-url.test.ts
          src/test/session-refresh.test.ts
          src/test/workspace-profile.test.ts
          src/test/workspace-profile-settings.test.ts
          src/test/workspace-overview.test.ts
          --rule 'prettier/prettier: off'

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Guard the public client bundle against server credentials
        run: bun run check:nextdoor-plus-public-bundle

      - name: Typecheck Nextdoor Plus data layer
        run: bunx tsc --noEmit -p tsconfig.nextdoor-plus.json
